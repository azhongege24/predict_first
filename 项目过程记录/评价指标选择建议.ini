一、评价指标选择建议
1. 基础回归指标（适用于每个输出特征）
MAE（平均绝对误差）：衡量预测值与真实值的绝对偏差，对异常值不敏感，适合作为核心指标 
RMSE（均方根误差）：对大误差更敏感，常用于惩罚预测偏差较大的情况。
R²（决定系数）：解释模型对数据方差的拟合程度，范围[0,1]，值越接近1越好 
2. 多任务综合指标
平均指标：对160个输出的MAE/RMSE/R²取均值或加权均值（如按特征重要性加权）。
可解释方差分数（Explained Variance Score）：衡量模型对多任务整体方差的解释能力，优于R²时说明模型捕捉了更多非线性关系 
分位数损失：若需关注不同误差分布（如极端值），可计算不同分位数下的误差 

3. 可视化辅助指标
残差分布图：每个输出特征的预测残差直方图，检查误差是否服从正态分布 

特征重要性排序：通过SHAP值或Permutation Importance分析13个输入特征对输出的贡献度 

二、Qt Designer可视化实现方案
1. 界面设计（Qt组件选择）
主界面布局：
输入区：13个输入字段（如QLineEdit或QSpinBox） 
输出展示区：分页显示160个输出结果，采用QTabWidget或QScrollArea滚动面板。
图表组件：
QChartView：内嵌折线图、散点图矩阵（展示关键输出特征的关系） 
Matplotlib嵌入：通过FigureCanvasQTAgg将Matplotlib图表集成到Qt界面（适合复杂图表） 
2. 可视化内容设计
全局指标面板：
显示MAE/RMSE/R²的均值及分布箱线图（使用QChart或Seaborn集成） 
输出特征子集展示：
散点图矩阵：选择10-20个关键输出特征，展示其预测值与真实值的分布及回归线 
3D曲面图：对具有空间关系的输出特征（如时间序列或空间坐标），使用QtDataVisualization模块 
动态交互功能：
通过QComboBox选择特定输出特征，动态刷新其残差图和误差指标 
鼠标悬停显示预测值-真实值对比（Tooltip集成） 
3. 性能优化
数据分块加载：160个输出分页显示，每页展示20-30个特征的折线图或热力图 
异步渲染：使用QThreadPool分离数据计算与UI渲染，避免界面卡顿 
缓存机制：预计算并缓存常用图表数据，减少实时计算开销 